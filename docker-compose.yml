services:
  db:
    image: postgres:17-alpine
    container_name: little-leaf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaf
      POSTGRES_PASSWORD: leaf
      POSTGRES_DB: little_leaf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: